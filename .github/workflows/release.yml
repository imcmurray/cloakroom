name: Release to npm

# Publishes @imcmurray/cloakroom with SLSA provenance on every version tag.
# Provenance requires CI + OIDC (it cannot be produced from a laptop), which is
# the point: every published tarball is verifiably built from this repo by this
# workflow. Verify any installed version with:
#   npm audit signatures
#
# Auth is npm trusted publishing: npm verifies this workflow's OIDC identity,
# so there is no long-lived token to expire or leak. Configured on npmjs.com
# (package settings > Trusted Publisher: imcmurray/cloakroom, release.yml,
# "Allow npm publish" only, environment npm-release). Needs npm >= 11.5.1,
# checked below. Hardening: publish runs only in the npm-release environment
# (manual approval, v* tags only), and v* tags can only be created by repo
# admins (tag ruleset). No npm cache here: a publishing job builds from a
# clean download, and there is no registry-url, so npm can't fall back to a
# placeholder token and hide an OIDC failure behind a misleading E404.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — trusted publishing (which also attaches provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the publishing job (cache poisoning). Set
          # explicitly: setup-node v5+ turns caching on by itself whenever
          # package.json gains a packageManager field.
          package-manager-cache: false
      - name: Guard - npm supports trusted publishing
        run: |
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "npm $(npm --version) < 11.5.1: no trusted publishing"; exit 1; }
      - run: npm ci
      # prepublishOnly runs typecheck + tests + a fresh CLI build again at
      # publish time; this early run fails fast before touching the registry.
      - run: npm run typecheck && npm test && npm run build:cli
      # Also runs on manual dispatch, so a dispatch from a branch fails here
      # instead of publishing an untagged build.
      - name: Guard - tag matches package.json version
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "not a tag: $GITHUB_REF_NAME"; exit 1; }
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }
      - run: npm publish --provenance --access public
