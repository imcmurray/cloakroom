name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `build` runs `tsc --noEmit && vite build`, so this also typechecks.
      - run: npm run build
      - run: npm test
      # Verify the CLI/hook binary bundles and actually runs.
      - run: npm run build:cli
      - name: CLI smoke test
        run: |
          node dist-cli/cloak.mjs --version
          printf 'connect 10.0.0.1 as a@b.com\n' > /tmp/smoke.txt
          # `scan` must exit 3 when it finds secrets (the CI/pre-commit contract).
          node dist-cli/cloak.mjs scan /tmp/smoke.txt && { echo "FAIL: scan should have found secrets"; exit 1; } || echo "OK: scan flagged secrets (exit 3)"
