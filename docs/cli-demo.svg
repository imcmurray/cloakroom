<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 304" width="780" height="304" role="img" aria-label="Terminal demo: cloak wrap sanitizes an incident log into reserved-range decoys for the LLM, then restores the real values in its reply.">
<style>
