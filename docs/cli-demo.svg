<text x="390" y="22" text-anchor="middle" class="c-faint" style="font-size:11px">cloak wrap — check your secrets at the door</text>
<g transform="translate(0 44)">
<g class="e1"><clipPath id="clip1"><rect x="26" y="8.5" height="21" width="0"/></clipPath><text x="26" y="21" clip-path="url(#clip1)"><tspan class="c-faint">$ </tspan><tspan class="c-text">cat incident.log</tspan></text></g><text class="e2" x="26" y="42"><tspan class="c-faint">[ERROR] </tspan><tspan class="c-text">auth failed for </tspan><tspan class="c-amber">sarah.kim@acmelegal.com</tspan><tspan class="c-text"> from </tspan><tspan class="c-amber">10.20.30.40</tspan></text><text class="e3" x="26" y="63"><tspan class="c-text">        card </tspan><tspan class="c-amber">4111 1111 1111 1111</tspan><tspan class="c-text"> flagged; retry from </tspan><tspan class="c-amber">10.20.30.40</tspan></text><g class="e4"><clipPath id="clip4"><rect x="26" y="71.5" height="21" width="0"/></clipPath><text x="26" y="84" clip-path="url(#clip4)"><tspan class="c-faint">$ </tspan><tspan class="c-text">cat incident.log | </tspan><tspan class="c-text">cloak wrap</tspan><tspan class="c-text"> -- claude -p </tspan><tspan class="c-faint">"diagnose this"</tspan></text></g><text class="e5" x="26" y="105"><tspan class="c-faint">        cloak · 3 values decoyed for the trip</tspan></text><text class="e6a" x="26" y="126"><tspan class="c-faint">  → claude sees  </tspan><tspan class="c-text">auth failed for </tspan><tspan class="c-amber">sarah.kim@acmelegal.com</tspan><tspan class="c-text"> from </tspan><tspan class="c-amber">10.20.30.40</tspan></text><text class="e6b" x="26" y="126"><tspan class="c-faint">  → claude sees  </tspan><tspan class="c-text">auth failed for </tspan><tspan class="c-cyan">casey.rivera@example.net</tspan><tspan class="c-text"> from </tspan><tspan class="c-cyan">203.0.113.181</tspan></text><text class="e7a" x="26" y="147"><tspan class="c-text">                 card </tspan><tspan class="c-amber">4111 1111 1111 1111</tspan><tspan class="c-text"> flagged; retry from </tspan><tspan class="c-amber">10.20.30.40</tspan></text><text class="e7b" x="26" y="147"><tspan class="c-text">                 card </tspan><tspan class="c-cyan">4716 9053 2881 4402</tspan><tspan class="c-text"> flagged; retry from </tspan><tspan class="c-cyan">203.0.113.181</tspan></text><text class="e8a" x="26" y="168"><tspan class="c-faint">  ← you get back </tspan><tspan class="c-text">The repeated retries from </tspan><tspan class="c-cyan">203.0.113.181</tspan><tspan class="c-text"> point at a gateway fault;</tspan></text><text class="e8b" x="26" y="168"><tspan class="c-faint">  ← you get back </tspan><tspan class="c-text">The repeated retries from </tspan><tspan class="c-amber">10.20.30.40</tspan><tspan class="c-text"> point at a gateway fault;</tspan></text><text class="e9a" x="26" y="189"><tspan class="c-text">                 reset the session for </tspan><tspan class="c-cyan">casey.rivera@example.net</tspan><tspan class="c-text"> and retry.</tspan></text><text class="e9b" x="26" y="189"><tspan class="c-text">                 reset the session for </tspan><tspan class="c-amber">sarah.kim@acmelegal.com</tspan><tspan class="c-text"> and retry.</tspan></text><text class="e10" x="26" y="231"><tspan class="c-cyan">✓ </tspan><tspan class="c-text">real data never left this machine</tspan></text>
</g>
