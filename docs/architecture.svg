<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Cloakroom round trip: on your machine, real values are swapped for reserved-range decoys and the mapping never leaves; only decoys cross the trust boundary to the LLM, and the reply is restored to real values locally.">
<style>
  .sans{font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,monospace}
  .t{fill:#C9D2E0;font-size:13px}
  .faint{fill:#68748A;font-size:11px}
  .tiny{fill:#68748A;font-size:10px}
  .amber{fill:#E8B04B}
  .cyan{fill:#4FD6C4}
  .cap{font-size:10.5px;letter-spacing:1.6px;fill:#68748A}
  @keyframes dotOut{
    0%,4%{transform:translate(196px,150px);opacity:0}
    7%{opacity:1}
    30%{transform:translate(300px,150px);}
    52%{transform:translate(404px,150px);}
    88%{transform:translate(672px,150px);opacity:1}
    92%,100%{transform:translate(672px,150px);opacity:0}
  }
  @keyframes dotOutFill{0%,38%{fill:#E8B04B}46%,100%{fill:#4FD6C4}}
  @keyframes dotBack{
    0%,4%{transform:translate(672px,286px);opacity:0}
    7%{opacity:1}
    45%{transform:translate(404px,286px);}
    62%{transform:translate(300px,286px);}
    88%{transform:translate(196px,286px);opacity:1}
    92%,100%{transform:translate(196px,286px);opacity:0}
  }
  @keyframes dotBackFill{0%,55%{fill:#4FD6C4}64%,100%{fill:#E8B04B}}
  .dotOut{animation:dotOut 9s linear infinite, dotOutFill 9s linear infinite}
  .dotBack{animation:dotBack 9s linear infinite 4.5s, dotBackFill 9s linear infinite 4.5s;opacity:0}
  @media (prefers-reduced-motion:reduce){.dotOut,.dotBack{animation:none;opacity:0}}
</style>
<defs>
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#68748A"/>
  </marker>
</defs>

<!-- canvas -->
<rect x="1" y="1" width="878" height="398" rx="12" fill="#10141C" stroke="#2A3242"/>

<!-- trusted zone -->
<rect x="20" y="46" width="552" height="330" rx="12" fill="#131926" stroke="#2A3242"/>
<text x="40" y="76" class="sans cap">YOUR MACHINE</text>
<text x="40" y="94" class="sans tiny">the only place real data or the mapping ever exists</text>

<!-- outside zone -->
<rect x="646" y="46" width="212" height="330" rx="12" fill="#171420" stroke="#33283A"/>
<text x="666" y="76" class="sans cap">THE OUTSIDE</text>
<text x="666" y="94" class="sans tiny">assumed hostile</text>

<!-- trust boundary -->
<line x1="609" y1="40" x2="609" y2="382" stroke="#68748A" stroke-dasharray="5 6" stroke-width="1.4"/>
<text x="609" y="30" text-anchor="middle" class="sans faint">trust boundary — only decoys cross</text>

<!-- ================= outbound row (y ~150) ================= -->
<!-- real value chip -->
<rect x="40" y="128" width="150" height="44" rx="9" fill="#1A1710" stroke="#E8B04B" stroke-opacity="0.55"/>
<text x="115" y="146" text-anchor="middle" class="sans tiny">your real data</text>
<text x="115" y="163" text-anchor="middle" class="mono amber" font-size="12.5">10.20.30.40</text>

<!-- engine box (spans both rows) -->
<rect x="248" y="112" width="150" height="212" rx="11" fill="#10141C" stroke="#4FD6C4" stroke-opacity="0.5" stroke-width="1.4"/>
<text x="323" y="140" text-anchor="middle" class="sans t" font-weight="600">cloak</text>
<text x="323" y="166" text-anchor="middle" class="sans tiny">detect → swap → restore</text>
<line x1="264" y1="206" x2="382" y2="206" stroke="#2A3242"/>
<text x="323" y="228" text-anchor="middle" class="sans tiny">the mapping stays here</text>
<text x="323" y="246" text-anchor="middle" class="mono" font-size="10"><tspan class="amber">10.20.30.40</tspan><tspan class="faint"> ⇄ </tspan><tspan class="cyan">203.0.113.181</tspan></text>
<text x="323" y="270" text-anchor="middle" class="sans tiny">at rest: AES-256-GCM</text>
<text x="323" y="286" text-anchor="middle" class="mono tiny">case.cloak</text>

<!-- decoy chip -->
<rect x="428" y="128" width="130" height="44" rx="9" fill="#0F1A1A" stroke="#4FD6C4" stroke-opacity="0.55"/>
<text x="493" y="146" text-anchor="middle" class="sans tiny">reserved-range decoy</text>
<text x="493" y="163" text-anchor="middle" class="mono cyan" font-size="12.5">203.0.113.181</text>

<!-- LLM box -->
<rect x="666" y="118" width="172" height="200" rx="11" fill="#10141C" stroke="#33283A" stroke-width="1.4"/>
<text x="752" y="150" text-anchor="middle" class="sans t" font-weight="600">any LLM</text>
<text x="752" y="170" text-anchor="middle" class="sans tiny">ChatGPT · Claude · Grok</text>
<text x="752" y="200" text-anchor="middle" class="sans tiny">reasons over realistic</text>
<text x="752" y="215" text-anchor="middle" class="sans tiny">values it can work with —</text>
<text x="752" y="230" text-anchor="middle" class="sans tiny">never sees a real one</text>

<!-- outbound arrows -->
<line x1="196" y1="150" x2="242" y2="150" stroke="#68748A" marker-end="url(#arr)"/>
<line x1="404" y1="150" x2="422" y2="150" stroke="#68748A" marker-end="url(#arr)"/>
<line x1="564" y1="150" x2="660" y2="150" stroke="#68748A" marker-end="url(#arr)"/>

<!-- ================= return row (y ~286) ================= -->
<rect x="428" y="264" width="130" height="44" rx="9" fill="#0F1A1A" stroke="#4FD6C4" stroke-opacity="0.55"/>
<text x="493" y="282" text-anchor="middle" class="sans tiny">the reply quotes decoys</text>
<text x="493" y="299" text-anchor="middle" class="mono cyan" font-size="12.5">203.0.113.181</text>

<rect x="40" y="264" width="150" height="44" rx="9" fill="#1A1710" stroke="#E8B04B" stroke-opacity="0.55"/>
<text x="115" y="282" text-anchor="middle" class="sans tiny">restored in the answer</text>
<text x="115" y="299" text-anchor="middle" class="mono amber" font-size="12.5">10.20.30.40</text>

<!-- return arrows (right to left) -->
<line x1="660" y1="286" x2="570" y2="286" stroke="#68748A" marker-end="url(#arr)"/>
<line x1="422" y1="286" x2="404" y2="286" stroke="#68748A" marker-end="url(#arr)"/>
<line x1="242" y1="286" x2="196" y2="286" stroke="#68748A" marker-end="url(#arr)"/>

<!-- travelling dots: amber→cyan out, cyan→amber back -->
<circle class="dotOut" r="4.5" cx="0" cy="0"/>
<circle class="dotBack" r="4.5" cx="0" cy="0"/>

</svg>
