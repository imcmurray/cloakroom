<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 409" width="780" height="409" role="img" aria-label="Terminal demo: a git commit carrying PII fails the cloak-scan pre-commit gate with a masked audit; after scrubbing the file, the same commit passes.">
<style>
text{font-family:'JetBrains Mono','Fira Code','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#C9D2E0;white-space:pre}
.c-text{fill:#C9D2E0}.c-faint{fill:#68748A}.c-amber{fill:#E8B04B}.c-cyan{fill:#4FD6C4}.c-red{fill:#E0685E}
@keyframes k1{0%,2.35%{width:0;opacity:1}10.00%,92.00%{width:273px;opacity:1}95.53%,100%{width:273px;opacity:0}}.e1 rect{animation:k1 17s steps(36) infinite}@keyframes k2{0%,12.94%{opacity:0;transform:translateY(3px)}15.00%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e2{opacity:0;animation:k2 17s ease-out infinite}@keyframes k3{0%,14.71%{opacity:0;transform:translateY(3px)}16.76%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e3{opacity:0;animation:k3 17s ease-out infinite}@keyframes k4{0%,19.41%{opacity:0;transform:translateY(3px)}21.47%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e4{opacity:0;animation:k4 17s ease-out infinite}@keyframes k5{0%,21.76%{opacity:0;transform:translateY(3px)}23.82%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e5{opacity:0;animation:k5 17s ease-out infinite}@keyframes k6{0%,23.24%{opacity:0;transform:translateY(3px)}25.29%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e6{opacity:0;animation:k6 17s ease-out infinite}@keyframes k7{0%,24.71%{opacity:0;transform:translateY(3px)}26.76%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e7{opacity:0;animation:k7 17s ease-out infinite}@keyframes k8{0%,31.76%{opacity:0;transform:translateY(3px)}33.82%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e8{opacity:0;animation:k8 17s ease-out infinite}@keyframes k9{0%,44.71%{width:0;opacity:1}54.12%,92.00%{width:589px;opacity:1}95.53%,100%{width:589px;opacity:0}}.e9 rect{animation:k9 17s steps(78) infinite}@keyframes k10{0%,58.24%{width:0;opacity:1}65.88%,92.00%{width:273px;opacity:1}95.53%,100%{width:273px;opacity:0}}.e10 rect{animation:k10 17s steps(36) infinite}@keyframes k11{0%,68.82%{opacity:0;transform:translateY(3px)}70.88%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e11{opacity:0;animation:k11 17s ease-out infinite}@keyframes k12{0%,72.35%{opacity:0;transform:translateY(3px)}74.41%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e12{opacity:0;animation:k12 17s ease-out infinite}@keyframes k13{0%,78.24%{opacity:0;transform:translateY(3px)}80.29%,92.00%{opacity:1;transform:none}95.53%,100%{opacity:0;transform:none}}.e13{opacity:0;animation:k13 17s ease-out infinite}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  text{opacity:1!important}
  [class^="e"][class$="a"]{opacity:0!important}
  clipPath rect{width:780px!important}
}
</style>
<rect x="1" y="1" width="778" height="407" rx="10" fill="#10141C" stroke="#2A3242"/>
<rect x="1" y="1" width="778" height="34" rx="10" fill="#161B26"/>
<rect x="1" y="24" width="778" height="10" fill="#161B26"/>
<circle cx="22" cy="18" r="4.5" fill="#2A3242"/>
<circle cx="40" cy="18" r="4.5" fill="#2A3242"/>
<circle cx="58" cy="18" r="4.5" fill="#2A3242"/>
<text x="390" y="22" text-anchor="middle" class="c-faint" style="font-size:11px">cloak scan — the pre-commit gate</text>
<g transform="translate(0 44)">
<g class="e1"><clipPath id="clip1"><rect x="26" y="8.5" height="21" width="0"/></clipPath><text x="26" y="21" clip-path="url(#clip1)"><tspan class="c-faint">$ </tspan><tspan class="c-text">git commit -m </tspan><tspan class="c-faint">"add incident notes"</tspan></text></g><text class="e2" x="26" y="42"><tspan class="c-text">cloak scan (PII/secret gate)</tspan><tspan class="c-faint">.................................</tspan><tspan class="c-red">Failed</tspan></text><text class="e3" x="26" y="63"><tspan class="c-faint">- exit code: 3</tspan></text><text class="e4" x="26" y="84"><tspan class="c-faint">notes/incident.md — </tspan><tspan class="c-text">detected 3 distinct value(s):</tspan></text><text class="e5" x="26" y="105"><tspan class="c-text">  EMAIL      1×  </tspan><tspan class="c-amber">sa████████om</tspan><tspan class="c-faint">   masked — originals are never printed</tspan></text><text class="e6" x="26" y="126"><tspan class="c-text">  IPV4       2×  </tspan><tspan class="c-amber">10████.40</tspan></text><text class="e7" x="26" y="147"><tspan class="c-text">  SSN        1×  </tspan><tspan class="c-amber">52███████34</tspan></text><text class="e8" x="26" y="189"><tspan class="c-red">✗ </tspan><tspan class="c-text">commit blocked — nothing sensitive reached git history</tspan></text><g class="e9"><clipPath id="clip9"><rect x="26" y="218.5" height="21" width="0"/></clipPath><text x="26" y="231" clip-path="url(#clip9)"><tspan class="c-faint">$ </tspan><tspan class="c-text">cloak sanitize notes/incident.md --bridge notes.cloak</tspan><tspan class="c-faint">  # scrub, keep the key</tspan></text></g><g class="e10"><clipPath id="clip10"><rect x="26" y="239.5" height="21" width="0"/></clipPath><text x="26" y="252" clip-path="url(#clip10)"><tspan class="c-faint">$ </tspan><tspan class="c-text">git commit -m </tspan><tspan class="c-faint">"add incident notes"</tspan></text></g><text class="e11" x="26" y="273"><tspan class="c-text">cloak scan (PII/secret gate)</tspan><tspan class="c-faint">.................................</tspan><tspan class="c-cyan">Passed</tspan></text><text class="e12" x="26" y="294"><tspan class="c-faint">[main 3f2a1c9] </tspan><tspan class="c-text">add incident notes</tspan></text><text class="e13" x="26" y="336"><tspan class="c-cyan">✓ </tspan><tspan class="c-undefined">the gate holds — secrets stay out of history</tspan></text>
</g>
<line x1="1" y1="34" x2="779" y2="34" stroke="#2A3242" stroke-width="1"/>
</svg>
